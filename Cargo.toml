[workspace]
resolver = "3"
exclude = ["fuzz"]
members = ["crates/agentdust-core", "crates/agentdust-agents", "crates/agentdust-mcp", "crates/agentdust", "crates/agentdust-testkit", "crates/agentdust-bench"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
publish = false

[workspace.dependencies]
agentdust-core = { path = "crates/agentdust-core" }
agentdust-agents = { path = "crates/agentdust-agents" }
agentdust-mcp = { path = "crates/agentdust-mcp" }
libc = "0.2.190"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.21"
toml = { version = "1.1.2", default-features = false, features = ["std", "serde", "parse"] }
hmac = "0.13.0"
sha2 = { version = "0.11.0", default-features = false }
proptest = { version = "1.11.0", default-features = false, features = ["std"] }
tokio = { version = "1.53.2", features = ["macros", "rt", "io-std", "io-util", "sync", "time"] }
rmcp = { version = "3.5.0", default-features = false, features = ["server", "macros", "transport-io", "elicitation"] }

[profile.release]
codegen-units = 1
strip = true

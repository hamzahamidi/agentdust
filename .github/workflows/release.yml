name: release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  RUST_TOOLCHAIN: "1.99.0"
  TAP_REPOSITORY: hamzahamidi/homebrew-agentdust

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      checks: read
    outputs:
      version: ${{ steps.tag.outputs.version }}
      commit: ${{ steps.main.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: tag
        name: The tag names the crate version
        run: |
          version="$(python3 scripts/check_release.py tag --tag "$GITHUB_REF_NAME")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - id: main
        name: Main contains the tag commit
        run: |
          commit="$(python3 scripts/check_release.py reachable --tag "$GITHUB_REF_NAME" --main-ref origin/main)"
          test "$(git rev-parse HEAD)" = "$commit"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
      - name: CI passed on the tag commit
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT: ${{ steps.main.outputs.commit }}
        run: |
          gh api --paginate "repos/$GITHUB_REPOSITORY/commits/$COMMIT/check-runs?per_page=100" > check-runs.json
          python3 scripts/check_release.py checks --commit "$COMMIT" --runs check-runs.json

  audit:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.commit }}
          persist-credentials: false
      - run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
      - uses: taiki-e/install-action@861a07ce7084f55488e375df125cdc99bba60eb7 # v2.87.23
        with:
          tool: cargo-audit
      - run: cargo audit

  build:
    needs: verify
    strategy:
      matrix:
        include:
          - copy: a
            target: darwin-arm64
            runner: macos-15
          - copy: b
            target: darwin-arm64
            runner: macos-15
          - copy: a
            target: linux-x64
            runner: ubuntu-24.04
          - copy: b
            target: linux-x64
            runner: ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.commit }}
          persist-credentials: false
      - run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
      - if: matrix.target == 'darwin-arm64'
        run: python3 scripts/toolchain.py check --include-lock
        env:
          DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
          SDKROOT: /Applications/Xcode_16.4.app/Contents/Developer/Platforms/MacOSX.platform/Developer/SDKs/MacOSX.sdk
      - if: matrix.target == 'darwin-arm64'
        run: python3 scripts/toolchain.py record > toolchain.json
        env:
          DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
          SDKROOT: /Applications/Xcode_16.4.app/Contents/Developer/Platforms/MacOSX.platform/Developer/SDKs/MacOSX.sdk
      - if: matrix.target == 'linux-x64'
        run: python3 scripts/toolchain.py record > toolchain.json
      - if: matrix.target == 'darwin-arm64'
        run: cargo build --release --locked -p agentdust
        env:
          DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
          SDKROOT: /Applications/Xcode_16.4.app/Contents/Developer/Platforms/MacOSX.platform/Developer/SDKs/MacOSX.sdk
      - if: matrix.target == 'linux-x64'
        run: cargo build --release --locked -p agentdust
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-${{ matrix.target }}-${{ matrix.copy }}
          path: |
            target/release/agentdust
            toolchain.json
          retention-days: 3

  package:
    needs: [verify, build]
    runs-on: macos-15
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.commit }}
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: builds
      - run: |
          for target in darwin-arm64 linux-x64; do
            python3 scripts/compare_builds.py "builds/build-$target-a" "builds/build-$target-b"
          done
      - run: |
          chmod +x builds/build-darwin-arm64-a/target/release/agentdust builds/build-darwin-arm64-b/target/release/agentdust
          chmod +x builds/build-linux-x64-a/target/release/agentdust builds/build-linux-x64-b/target/release/agentdust
          test "$(builds/build-darwin-arm64-a/target/release/agentdust version)" = "agentdust $VERSION"
      - run: |
          epoch="$(git log -1 --format=%ct)"
          for target in darwin-arm64 linux-x64; do
            SOURCE_DATE_EPOCH="$epoch" python3 scripts/package.py --binary "builds/build-$target-a/target/release/agentdust" --version "$VERSION" --target "$target" --out-dir dist
            SOURCE_DATE_EPOCH="$epoch" python3 scripts/package.py --binary "builds/build-$target-b/target/release/agentdust" --version "$VERSION" --target "$target" --out-dir second
            cmp "dist/agentdust-$VERSION-$target.tar.gz" "second/agentdust-$VERSION-$target.tar.gz"
          done
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm install --global npm@12.1.0 --ignore-scripts
      - name: Pack both native binaries with npm
        run: |
          for copy in a b; do
            mkdir -p "npm-build/$copy/bin" "npm-build/$copy/vendor/darwin-arm64" "npm-build/$copy/vendor/linux-x64" "npm-dist/$copy"
            cp npm/package.json LICENSE README.md "npm-build/$copy/"
            install -m 755 npm/bin/agentdust.js "npm-build/$copy/bin/agentdust.js"
            install -m 755 "builds/build-darwin-arm64-$copy/target/release/agentdust" "npm-build/$copy/vendor/darwin-arm64/agentdust"
            install -m 755 "builds/build-linux-x64-$copy/target/release/agentdust" "npm-build/$copy/vendor/linux-x64/agentdust"
            npm --prefix "npm-build/$copy" version "$VERSION" --no-git-tag-version --ignore-scripts --allow-same-version
            npm pack "./npm-build/$copy" --pack-destination "npm-dist/$copy" --ignore-scripts
          done
          cmp "npm-dist/a/agentdust-$VERSION.tgz" "npm-dist/b/agentdust-$VERSION.tgz"
          cp "npm-dist/a/agentdust-$VERSION.tgz" dist/
      - name: Check the npm global installation
        run: |
          npm install --global --prefix "$RUNNER_TEMP/npm-prefix" "./dist/agentdust-$VERSION.tgz" --ignore-scripts --no-audit --no-fund
          test "$("$RUNNER_TEMP/npm-prefix/bin/agentdust" version)" = "agentdust $VERSION"
          cmp builds/build-darwin-arm64-a/target/release/agentdust "npm-build/a/vendor/darwin-arm64/agentdust"
          cmp builds/build-darwin-arm64-a/target/release/agentdust "$RUNNER_TEMP/npm-prefix/lib/node_modules/agentdust/vendor/darwin-arm64/agentdust"
      - uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: cyclonedx-json
          output-file: dist/agentdust-${{ env.VERSION }}-sbom.cdx.json
          syft-version: v1.54.0
          upload-artifact: false
          upload-release-assets: false
      - run: |
          cd dist
          shasum -a 256 *.tar.gz *.tgz *-sbom.cdx.json > SHA256SUMS
          shasum -a 256 -c SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            builds/build-darwin-arm64-a/target/release/agentdust
            builds/build-linux-x64-a/target/release/agentdust
            dist/*.tar.gz
            dist/*.tgz
            dist/*-sbom.cdx.json
      - run: |
          python3 scripts/formula.py --tarball "dist/agentdust-$VERSION-darwin-arm64.tar.gz" --version "$VERSION" --url "https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/agentdust-$VERSION-darwin-arm64.tar.gz" --out formula/agentdust.rb
          ruby -c formula/agentdust.rb
      - run: |
          python3 scripts/formula.py --tarball "dist/agentdust-$VERSION-darwin-arm64.tar.gz" --version "$VERSION" --url "file://$PWD/dist/agentdust-$VERSION-darwin-arm64.tar.gz" --out smoke/agentdust.rb
          python3 scripts/brew_smoke.py smoke/agentdust.rb "$VERSION"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-files
          path: dist
          retention-days: 3
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: homebrew-formula
          path: formula/agentdust.rb
          retention-days: 3

  linux-acceptance:
    needs: [verify, build, package]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.commit }}
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: build-linux-x64-a
          path: build
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-files
          path: dist
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Verify the Linux archive and npm install
        run: |
          install -m 755 build/target/release/agentdust "$RUNNER_TEMP/agentdust-linux"
          test "$("$RUNNER_TEMP/agentdust-linux" version)" = "agentdust $VERSION"
          mkdir -p "$RUNNER_TEMP/archive"
          tar -xzf "dist/agentdust-$VERSION-linux-x64.tar.gz" -C "$RUNNER_TEMP/archive"
          cmp "$RUNNER_TEMP/agentdust-linux" "$RUNNER_TEMP/archive/agentdust-$VERSION-linux-x64/agentdust"
          npm install --global --prefix "$RUNNER_TEMP/npm-prefix" "./dist/agentdust-$VERSION.tgz" --ignore-scripts --no-audit --no-fund
          test "$("$RUNNER_TEMP/npm-prefix/bin/agentdust" version)" = "agentdust $VERSION"
          cmp "$RUNNER_TEMP/agentdust-linux" "$RUNNER_TEMP/npm-prefix/lib/node_modules/agentdust/vendor/linux-x64/agentdust"

  wsl2-acceptance:
    needs: [verify, package]
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.commit }}
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-files
          path: dist
      - name: Install Ubuntu 24.04 under WSL2
        shell: pwsh
        run: |
          wsl.exe --version
          wsl.exe --install --distribution Ubuntu-24.04 --no-launch --web-download
          if ($LASTEXITCODE -ne 0) { throw 'Ubuntu 24.04 WSL installation failed' }
      - name: Prepare the ext4 workspace and systemd
        shell: pwsh
        run: |
          $windowsWorkspace = $env:GITHUB_WORKSPACE.Replace('\', '/')
          $workspaceOutput = & wsl.exe --distribution Ubuntu-24.04 --user root -- wslpath -u $windowsWorkspace
          if ($LASTEXITCODE -ne 0) { throw 'Could not locate the repository from WSL' }
          $workspace = ($workspaceOutput -join '').Trim()
          if ([string]::IsNullOrWhiteSpace($workspace)) { throw 'WSL returned an empty repository path' }
          wsl.exe --distribution Ubuntu-24.04 --user root -- bash -lc "bash '$workspace/scripts/wsl2_bootstrap.sh' '$workspace'"
          if ($LASTEXITCODE -ne 0) { throw 'WSL bootstrap failed' }
          wsl.exe --shutdown
          wsl.exe --distribution Ubuntu-24.04 --user root -- bash -lc "bash '$workspace/scripts/wsl2_systemd_bootstrap.sh'"
          if ($LASTEXITCODE -ne 0) { throw 'WSL systemd user manager did not start' }
      - name: Verify the exact Linux release files in WSL2
        shell: pwsh
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          $windowsDist = ($env:GITHUB_WORKSPACE.Replace('\', '/') + '/dist')
          $distOutput = & wsl.exe --distribution Ubuntu-24.04 --user root -- wslpath -u $windowsDist
          if ($LASTEXITCODE -ne 0) { throw 'Could not locate the release artifacts from WSL' }
          $dist = ($distOutput -join '').Trim()
          if ([string]::IsNullOrWhiteSpace($dist)) { throw 'WSL returned an empty release artifact path' }
          wsl.exe --distribution Ubuntu-24.04 --user agentdust -- env "AGENTDUST_RELEASE_DIST=$dist" bash -lc 'cd /home/agentdust/work/agentdust && bash scripts/wsl2_acceptance.sh'
          if ($LASTEXITCODE -ne 0) { throw 'WSL2 release acceptance failed' }

  release:
    needs: [verify, audit, package, linux-acceptance, wsl2-acceptance]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.verify.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-files
          path: dist
      - run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --draft --title "$GITHUB_REF_NAME" --generate-notes dist/*

  tap-pr:
    needs: [verify, package, release]
    runs-on: ubuntu-24.04
    environment: release
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.verify.outputs.version }}
      TAP_ENABLED: ${{ secrets.HOMEBREW_TAP_TOKEN != '' }}
    steps:
      - if: env.TAP_ENABLED != 'true'
        run: echo "HOMEBREW_TAP_TOKEN is not set, so no tap pull request is opened"
      - if: env.TAP_ENABLED == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.commit }}
          persist-credentials: false
      - if: env.TAP_ENABLED == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: homebrew-formula
          path: formula
      - if: env.TAP_ENABLED == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.TAP_REPOSITORY }}
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap
          fetch-depth: 0
          persist-credentials: false
      - if: env.TAP_ENABLED == 'true'
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          export TAP_DIR=tap
          export FORMULA=formula/agentdust.rb
          bash scripts/create_tap_pr.sh

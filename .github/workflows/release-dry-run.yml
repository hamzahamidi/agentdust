name: release-dry-run

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  RUST_TOOLCHAIN: "1.99.0"

jobs:
  build:
    strategy:
      matrix:
        copy: [a, b]
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
      - run: python3 scripts/toolchain.py record > toolchain.json
      - run: python3 scripts/toolchain.py check --allow-missing
      - run: cargo build --release --locked -p agentdust
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-${{ matrix.copy }}
          path: |
            target/release/agentdust
            toolchain.json
          retention-days: 3

  package:
    needs: build
    runs-on: macos-15
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read the workspace version
        run: echo "VERSION=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: builds
      - run: python3 scripts/compare_builds.py builds/build-a builds/build-b
      - run: SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)" python3 scripts/package.py --binary builds/build-a/target/release/agentdust --version "$VERSION" --out-dir dist
      - uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: cyclonedx-json
          output-file: dist/agentdust-${{ env.VERSION }}-sbom.cdx.json
          syft-version: v1.54.0
          upload-artifact: false
          upload-release-assets: false
      - run: cd dist && shasum -a 256 *.tar.gz *-sbom.cdx.json > SHA256SUMS && shasum -a 256 -c SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            builds/build-a/target/release/agentdust
            dist/*.tar.gz
            dist/*-sbom.cdx.json
      - run: python3 scripts/formula.py --tarball "dist/agentdust-$VERSION-darwin-arm64.tar.gz" --version "$VERSION" --url "file://$PWD/dist/agentdust-$VERSION-darwin-arm64.tar.gz" --out dist/agentdust.rb
      - run: python3 scripts/brew_smoke.py dist/agentdust.rb "$VERSION"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-dry-run
          path: |
            dist
            builds/build-a/toolchain.json
          retention-days: 3

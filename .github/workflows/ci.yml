name: ci

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: "1.99.0"
  FUZZ_TOOLCHAIN: "nightly-2026-10-02"

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 scripts/check_threat_model.py
      - run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal -c clippy -c rustfmt
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --exclude agentdust --all-targets --locked -- -D warnings
      - run: cargo test --workspace --exclude agentdust --locked
      - uses: taiki-e/install-action@861a07ce7084f55488e375df125cdc99bba60eb7 # v2.87.23
        with:
          tool: cargo-deny,cargo-audit,cargo-fuzz@0.13.2
      - run: cargo deny check
      - run: cargo audit
      - run: rustup toolchain install "$FUZZ_TOOLCHAIN" --profile minimal
      - name: Build every fuzz target and replay its seeds
        run: |
          targets="$(cargo "+$FUZZ_TOOLCHAIN" fuzz list)"
          test -n "$targets"
          for target in $targets; do
            test -d "fuzz/seeds/$target"
            cargo "+$FUZZ_TOOLCHAIN" fuzz run "$target" "fuzz/seeds/$target" --target x86_64-unknown-linux-gnu -- -runs=0
          done

  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal -c clippy
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm install --global npm@12.1.0 --ignore-scripts
      - name: Check the npm global installation
        run: |
          version="$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')"
          mkdir -p npm-build/bin dist
          cp npm/package.json LICENSE README.md npm-build/
          install -m 755 target/debug/agentdust npm-build/bin/agentdust
          npm --prefix npm-build version "$version" --no-git-tag-version --ignore-scripts --allow-same-version
          npm pack ./npm-build --pack-destination dist --ignore-scripts
          npm install --global --prefix "$RUNNER_TEMP/npm-prefix" "./dist/agentdust-$version.tgz" --ignore-scripts --no-audit --no-fund
          test "$("$RUNNER_TEMP/npm-prefix/bin/agentdust" version)" = "agentdust $version"
          cmp target/debug/agentdust "$RUNNER_TEMP/npm-prefix/bin/agentdust"
      - name: Build the isolated automatic cleanup fixtures
        run: cargo build --locked -p agentdust -p agentdust-testkit --bins
      - name: Check automatic cleanup after owner exit and worker restart
        env:
          AGENTDUST_FIXTURE_SLEEPER: ${{ github.workspace }}/target/debug/fixture-sleeper
        run: cargo test --locked -p agentdust --test automatic_worker -- --ignored --test-threads=1
      - name: Check controlled TCP listener recovery
        env:
          AGENTDUST_FIXTURE_LISTENER: ${{ github.workspace }}/target/debug/fixture-listener
        run: cargo test --locked -p agentdust --test port -- --ignored --test-threads=1
      - run: cargo test --release -p agentdust --test hook_latency --locked -- --ignored --nocapture --test-threads=1
